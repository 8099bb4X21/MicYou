name: Feature Test Build (Android)

# fork 内测试专用：只编安卓自签名 APK。与 Windows 编译完全独立，互不触发。
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read Version
        id: version
        run: |
          VERSION=$(grep "^project.version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "liberica"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置，请到仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build Android Release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 阿里云镜像偶发502，重试5次（真编译错误会连挂5次，届时看日志修代码）
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Build attempt $attempt/5"
            if ./gradlew :composeApp:assembleRelease; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "::error::Build failed after 5 attempts"
          exit 1
      - name: Prepare Android Artifact
        run: |
          mkdir -p ci-artifacts
          APK=$(ls composeApp/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          cp "$APK" "ci-artifacts/MicYou-Android-${{ steps.version.outputs.version }}-remote-key.apk"
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MicYou-Android-${{ steps.version.outputs.version }}-remote-key
          path: ci-artifacts/MicYou-Android-${{ steps.version.outputs.version }}-remote-key.apk
          if-no-files-found: error