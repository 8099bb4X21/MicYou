name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ----------------- 计算发布标签（日期+序号+_voice） -----------------
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute release tag
        id: compute
        run: |
          # 标签 = 北京时间日期 + 当天序号(2位) + _voice，例如 2026101901_voice
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          # 远程查询当天已有 tag，取最大序号（不依赖本地 tags）
          SEQ=$(git ls-remote --tags origin "refs/tags/${DATE}*_voice" 2>/dev/null \
            | sed 's#.*refs/tags/##' \
            | grep -oE "^${DATE}[0-9]{2}_voice$" \
            | sed -E "s/^${DATE}([0-9]{2})_voice$/\1/" \
            | sort -n | tail -1)
          SEQ=${SEQ:-0}
          NEXT=$(printf "%02d" $((10#$SEQ + 1)))
          TAG="${DATE}${NEXT}_voice"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Computed tag: $TAG"

  # ----------------- Android Release 构建 -----------------
  build-android:
    needs: tag
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read Version
        id: version
        run: |
          VERSION=$(grep "^project.version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "liberica"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode Keystore
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          fi
      - name: Write Aifadian Config
        env:
          AIFADIAN_API_TOKEN: ${{ secrets.AIFADIAN_API_TOKEN }}
          AIFADIAN_USER_ID: ${{ secrets.AIFADIAN_USER_ID }}
        run: |
          if [ -n "$AIFADIAN_API_TOKEN" ]; then
            echo "AIFADIAN_API_TOKEN=$AIFADIAN_API_TOKEN" >> local.properties
            echo "AIFADIAN_USER_ID=$AIFADIAN_USER_ID" >> local.properties
          fi
      - name: Build Android Release
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease
      - name: Prepare Android Artifact
        continue-on-error: true
        run: |
          mkdir -p ci-artifacts
          APK=$(ls composeApp/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found, skipping"
            exit 0
          fi
          cp "$APK" "ci-artifacts/MicYou-Android-${{ needs.tag.outputs.tag }}.apk"
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MicYou-Android-${{ needs.tag.outputs.tag }}
          path: ci-artifacts/MicYou-Android-${{ needs.tag.outputs.tag }}.apk
          if-no-files-found: ignore

  # ----------------- Tauri Windows 构建 -----------------
  build-tauri-windows:
    needs: tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path gradle.properties -Pattern '^project\.version=').Line
          $version = $line.Split('=')[1].Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tauri-app/package.json
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app -> target
          cache-on-failure: true
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: tauri-app
      - name: Build Tauri App (Windows)
        run: bun run tauri build --no-bundle
        working-directory: tauri-app
      - name: Build Inno Setup Installer
        shell: pwsh
        working-directory: tauri-app
        run: |
          $version = '${{ steps.version.outputs.version }}'
          iscc /DMyAppVersion="$version" src-tauri/installer.iss
      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          $tag = '${{ needs.tag.outputs.tag }}'
          $installer = Get-ChildItem -Path tauri-app/src-tauri/target/release/bundle/inno -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Warning "No installer found, skipping artifact upload"
            exit 0
          }
          Copy-Item $installer.FullName "ci-artifacts/MicYou-Win-$tag-installer.exe" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MicYou-Win-${{ needs.tag.outputs.tag }}
          path: ci-artifacts/MicYou-Win-${{ needs.tag.outputs.tag }}-installer.exe
          if-no-files-found: ignore

  # Fork 说明：只发 Windows + 安卓，macOS/Linux 构建已删（上游恢复见 git 历史）。
  # ----------------- 发布 Release -----------------
  release:
    needs: [tag, build-tauri-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Include WinUHID 2.15 driver package
        run: |
          cp tauri-app/src-tauri/assets/winuhid/WinUHid_Win10_2.15.zip release-artifacts/
          ls -la release-artifacts/
      - name: Get Last Contributor
        id: contributor
        run: |
          AUTHOR_NAME=$(git log -1 --format='%an')
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          echo "name=$AUTHOR_NAME" >> $GITHUB_OUTPUT
          echo "email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT
          echo "Last contributor: $AUTHOR_NAME <$AUTHOR_EMAIL>"
      - name: Configure Git
        run: |
          git config --global user.name "${{ steps.contributor.outputs.name }}"
          git config --global user.email "${{ steps.contributor.outputs.email }}"
      - name: Create Tag (if not exists)
        run: |
          TAG_NAME="${{ needs.tag.outputs.tag }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: release-artifacts/**/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger MirrorChyanUploading
        if: ${{ github.repository_owner == 'LanRhyme' }}
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.tag.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.tag.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
