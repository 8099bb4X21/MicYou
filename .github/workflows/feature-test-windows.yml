name: Feature Test Build (Windows)

# fork 内测试专用：只编 Windows 安装包。与安卓编译完全独立，互不触发。
on:
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path gradle.properties -Pattern '^project\.version=').Line
          $version = $line.Split('=')[1].Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tauri-app/package.json
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app -> target
          cache-on-failure: true
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile
        working-directory: tauri-app
      - name: Build Tauri App (Windows)
        run: bun run tauri build --no-bundle
        working-directory: tauri-app
      - name: Build Inno Setup Installer
        shell: pwsh
        working-directory: tauri-app
        run: |
          $version = '${{ steps.version.outputs.version }}'
          iscc /DMyAppVersion="$version" src-tauri/installer.iss
      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          $installer = Get-ChildItem -Path tauri-app/src-tauri/target/release/bundle/inno -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer found"
            exit 1
          }
          Copy-Item $installer.FullName "ci-artifacts/MicYou-Win-$version-remote-key-installer.exe" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MicYou-Win-${{ steps.version.outputs.version }}-remote-key
          path: ci-artifacts/MicYou-Win-${{ steps.version.outputs.version }}-remote-key-installer.exe
          if-no-files-found: error