name: Feature Test Build (signed)

# fork内测试专用：push到功能分支即编出自签名测试包，不合上游、不建tag、不发Release。
# 产物：自签名安卓Release APK + Windows安装包，文件名带remote-key后缀以区别官方版本。

on:
  push:
    branches: ["feature/remote-key"]
  workflow_dispatch:

jobs:
  # ----------------- Android Release 构建（自签名） -----------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read Version
        id: version
        run: |
          VERSION=$(grep "^project.version=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "liberica"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置，请到仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build Android Release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 阿里云镜像偶发502，重试5次（真编译错误会连挂5次，届时看日志修代码）
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Build attempt $attempt/5"
            if ./gradlew :composeApp:assembleRelease; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "::error::Build failed after 3 attempts"
          exit 1
      - name: Prepare Android Artifact
        run: |
          mkdir -p ci-artifacts
          APK=$(ls composeApp/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          cp "$APK" "ci-artifacts/MicYou-Android-${{ steps.version.outputs.version }}-remote-key.apk"
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MicYou-Android-${{ steps.version.outputs.version }}-remote-key
          path: ci-artifacts/MicYou-Android-${{ steps.version.outputs.version }}-remote-key.apk
          if-no-files-found: error

  # ----------------- Tauri Windows 构建 -----------------
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path gradle.properties -Pattern '^project\.version=').Line
          $version = $line.Split('=')[1].Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app -> target
          cache-on-failure: true
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: Install Frontend Dependencies
        run: npm ci --include=dev
        working-directory: tauri-app
      - name: Build Tauri App (Windows)
        run: npm run tauri -- build --no-bundle
        working-directory: tauri-app
      - name: Build Inno Setup Installer
        shell: pwsh
        working-directory: tauri-app
        run: |
          $version = '${{ steps.version.outputs.version }}'
          iscc /DMyAppVersion="$version" src-tauri/installer.iss
      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          $installer = Get-ChildItem -Path tauri-app/src-tauri/target/release/bundle/inno -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer found"
            exit 1
          }
          Copy-Item $installer.FullName "ci-artifacts/MicYou-Win-$version-remote-key-installer.exe" -Force
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MicYou-Win-${{ steps.version.outputs.version }}-remote-key
          path: ci-artifacts/MicYou-Win-${{ steps.version.outputs.version }}-remote-key-installer.exe
          if-no-files-found: error
